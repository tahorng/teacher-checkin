<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的課表</title>
<style>
  body { font-family: -apple-system, "Microsoft JhengHei", sans-serif; background:#f4f6f8; margin:0; padding:16px 16px 90px; color:#2c3e50; }
  h2 { margin: 8px 0 4px; font-size:19px; }
  .sub { color:#7f8c8d; font-size:13px; margin-bottom:14px; }
  .card { background:#fff; border-radius:10px; padding:12px 14px; margin-bottom:8px; box-shadow:0 1px 4px rgba(0,0,0,0.08); }
  .school-tag { font-size:12px; color:#3498db; font-weight:bold; }
  .day-head { font-size:13px; font-weight:bold; color:#7f8c8d; margin:16px 0 6px; border-bottom:1px solid #e0e0e0; padding-bottom:4px; }
  .lesson-time { font-size:13px; color:#7f8c8d; }
  .lesson-info { font-size:16px; margin:3px 0 0; font-weight:bold; }
  .lesson-info .course { font-size:13px; color:#7f8c8d; font-weight:normal; }
  .btn { display:inline-block; padding:9px 16px; border-radius:6px; font-weight:bold; color:#fff; border:none; font-size:14px; cursor:pointer; }
  .btn-nav { background:#fff; color:#3498db; border:1px solid #cfe3f5; padding:6px 12px; font-size:13px; }
  .btn-nav:disabled { color:#bbb; border-color:#eee; }
  .btn-primary { background:#3498db; }
  .btn-grey { background:#95a5a6; }
  .weekbar { display:flex; justify-content:space-between; align-items:center; gap:6px; margin-bottom:12px; }
  .fab { position:fixed; left:16px; right:16px; bottom:16px; padding:14px; font-size:16px; background:#27ae60; text-align:center; border-radius:8px; color:#fff; font-weight:bold; border:none; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,0.2); }
  .empty { text-align:center; color:#bbb; padding:36px 0; }
  .error-box { text-align:center; padding:60px 20px; color:#c0392b; }
  .msg { padding:10px 14px; border-radius:8px; font-size:13px; margin-bottom:14px; }
  .msg.ok { background:#eafaf1; border:1px solid #a3e4c1; color:#1a7a4c; }
  .msg.error { background:#fdecea; border:1px solid #f5b7b1; color:#a93226; }
  .loading { text-align:center; color:#999; padding:40px 0; }
  label.f { display:block; font-size:13px; color:#7f8c8d; margin:12px 0 4px; }
  select, input[type=date], input[type=time] { width:100%; padding:10px; font-size:15px; border:1px solid #ddd; border-radius:6px; box-sizing:border-box; background:#fff; }
  .tl-wrap { margin-top:10px; background:#fff; border:1px solid #e5e5e5; border-radius:8px; padding:8px 8px 6px; }
  .tl-head { display:flex; font-size:11px; color:#7f8c8d; margin-left:38px; }
  .tl-head div { flex:1; text-align:center; }
  .tl { position:relative; margin-top:4px; }
  .tl-hour { position:absolute; left:0; right:0; border-top:1px solid #f0f0f0; font-size:10px; color:#bbb; padding-left:2px; box-sizing:border-box; }
  .tl-lanes { position:absolute; left:38px; right:0; top:0; bottom:0; display:flex; gap:4px; }
  .tl-lane { position:relative; flex:1; background:#fafafa; border-radius:4px; cursor:pointer; }
  .tl-block { position:absolute; left:2px; right:2px; border-radius:3px; font-size:10px; overflow:hidden; padding:1px 3px; box-sizing:border-box; line-height:1.2; }
  .tl-mine { background:#d6eaf8; border:1px solid #a9cce3; color:#21618c; }
  .tl-room { background:#eceff1; border:1px solid #cfd8dc; color:#78909c; }
  .tl-sel  { background:rgba(39,174,96,0.30); border:2px dashed #27ae60; color:#1a7a4c; font-weight:bold; z-index:2; }
  .tl-sel.clash { background:rgba(231,76,60,0.30); border-color:#e74c3c; color:#a93226; }
  .tl-tip { font-size:11px; color:#95a5a6; margin-top:4px; text-align:center; }
  .tl-clash-msg { font-size:12px; color:#a93226; background:#fdecea; border:1px solid #f5b7b1; border-radius:5px; padding:5px 8px; margin-top:6px; }
  .wg-wrap { margin-top:10px; background:#fff; border:1px solid #e5e5e5; border-radius:8px; padding:8px 6px 6px; }
  .wg-nav { display:flex; justify-content:space-between; align-items:center; font-size:12px; color:#7f8c8d; margin-bottom:6px; }
  .wg-head { display:flex; margin-left:30px; }
  .wg-head div { flex:1; text-align:center; font-size:11px; color:#7f8c8d; padding-bottom:3px; }
  .wg-head div.today { color:#e67e22; font-weight:bold; }
  .wg { position:relative; }
  .wg-hour { position:absolute; left:0; right:0; border-top:1px solid #f2f2f2; font-size:9px; color:#c0c0c0; box-sizing:border-box; }
  .wg-cols { position:absolute; left:30px; right:0; top:0; bottom:0; display:flex; gap:2px; }
  .wg-col { position:relative; flex:1; background:#fbfbfb; border-radius:3px; cursor:pointer; }
  .wg-col.past { background:#f5f5f5; cursor:not-allowed; }
  .wg-b { position:absolute; left:1px; right:1px; border-radius:2px; }
  .wg-mine { background:#aed6f1; border:1px solid #85c1e9; }
  .wg-room { background:repeating-linear-gradient(45deg,#e8e8e8,#e8e8e8 3px,#d5d5d5 3px,#d5d5d5 6px); border:1px solid #d5d5d5; }
  .wg-sel { background:rgba(39,174,96,0.45); border:2px solid #27ae60; z-index:3; }
  .wg-sel.clash { background:rgba(231,76,60,0.45); border-color:#e74c3c; }
  .wg-legend { font-size:11px; color:#95a5a6; margin-top:5px; text-align:center; line-height:1.6; }
  .wg-legend i { display:inline-block; width:9px; height:9px; border-radius:2px; vertical-align:-1px; margin-right:2px; }
</style>
</head>
<body>
<div id="app"><p class="loading">載入中...</p></div>

<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
const API = 'https://btxijcauqsmtdggfcwev.supabase.co/functions/v1/teacher-schedule';
// ⚠️ 這頁要用自己的 LIFF App ID（每個頁面一個），不能沿用簽到或綁定頁的
const LIFF_ID = '2010807019-6XGg173m';

// 調課沿用現有的 teacher-reschedule Edge Function，後端一行都沒改——
// 規則（團體班排除、教室衝突改選、寫 log）都是已經驗證過的，不重新發明
const RESCHEDULE_API = 'https://btxijcauqsmtdggfcwev.supabase.co/functions/v1/teacher-reschedule';

let TOKEN = null;
let WEEK = 0;
let RS_IDS = {};          // 可調課的 lesson id -> true
let RS_LOADED = false;
let RS_PICKED = null;     // 目前正在調的那堂課
let RS_PENDING = null;    // 教室衝突後重送用，時間沿用第一次的選擇
let RS_WEEK_OFF = 0;      // 調課網格目前顯示第幾週（相對選定日期那週）
let VIEW = 'week';        // 'week' | 'form'
let STUDENTS = [];
let ROOMS = [];
let PENDING_MSG = '';

function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function getTokenFromUrl() {
    const p = new URLSearchParams(location.search);
    let t = p.get('token');
    if (!t && p.get('liff.state')) {
        const st = new URLSearchParams(p.get('liff.state').replace(/^\?/, ''));
        t = st.get('token');
    }
    return t;
}
function showError(title, text) {
    document.getElementById('app').innerHTML = '<div class="error-box"><h2>' + esc(title) + '</h2><p>' + esc(text) + '</p></div>';
}
function msgHtml() {
    if (!PENDING_MSG) return '';
    const ok = PENDING_MSG.indexOf('ok:') === 0;
    const t = PENDING_MSG.replace(/^(ok:|error:)/, '');
    PENDING_MSG = '';
    return '<div class="msg ' + (ok ? 'ok' : 'error') + '">' + esc(t) + '</div>';
}
const DAYS = ['日','一','二','三','四','五','六'];
function dayLabel(iso) {
    const d = iso.slice(0, 10);
    const dt = new Date(d + 'T00:00:00');
    return d.slice(5).replace('-', '/') + '（' + DAYS[dt.getDay()] + '）';
}

// ---------- 課表 ----------
// 哪些課可以自行調整，以現有調課 API 的判斷為準（未來 60 天、非團體班、學校有開放）
async function loadReschedulable() {
    if (RS_LOADED) return;
    try {
        const res = await fetch(RESCHEDULE_API + '?token=' + encodeURIComponent(TOKEN));
        const data = await res.json();
        RS_IDS = {};
        if (data.success && data.enabled !== false) {
            (data.lessons || []).forEach(function(l) { RS_IDS[l.id] = true; });
        }
    } catch (e) { RS_IDS = {}; }
    RS_LOADED = true;
}

async function loadWeek() {
    document.getElementById('app').innerHTML = '<p class="loading">載入中...</p>';
    try {
        await loadReschedulable();
        const res = await fetch(API + '?token=' + encodeURIComponent(TOKEN) + '&week=' + WEEK);
        const data = await res.json();
        if (!data.success) { showError('連結已失效', data.message || '請回到 LINE 重新開啟。'); return; }
        renderWeek(data);
    } catch (e) { showError('載入失敗', '網路連線異常，請稍後再試。'); }
}

function renderWeek(data) {
    let html = msgHtml();
    html += '<div class="weekbar">'
        + '<button class="btn btn-nav" onclick="shiftWeek(-1)">‹ 上週</button>'
        + '<span style="font-size:13px; color:#7f8c8d;">' + esc(data.weekStart.slice(5)) + ' ~ ' + esc(data.weekEnd.slice(5)) + '</span>'
        + '<button class="btn btn-nav" onclick="shiftWeek(1)">下週 ›</button>'
        + '</div>';
    if (WEEK !== 0) html += '<p style="text-align:center; margin:-4px 0 12px;"><button class="btn btn-nav" onclick="gotoWeek(0)">回到本週</button></p>';

    if (!data.lessons || data.lessons.length === 0) {
        html += '<p class="empty">這一週沒有排課</p>';
    } else {
        let lastDay = '';
        data.lessons.forEach(function(l) {
            const day = l.start_time.slice(0, 10);
            if (day !== lastDay) { html += '<div class="day-head">' + dayLabel(l.start_time) + '</div>'; lastDay = day; }
            const where = [l.school_name, l.classroom_name].filter(Boolean).join(' · ');
            // 只有這堂課本身可調整時才出現按鈕；不可調的課就純顯示
            const rsBtn = RS_IDS[l.id]
                ? '<button class="btn btn-nav" style="margin-top:8px;" onclick=\'openReschedule(' + JSON.stringify(JSON.stringify(l)) + ')\'>🗓️ 調整時間</button>'
                : '';
            html += '<div class="card">'
                + (where ? '<div class="school-tag">' + esc(where) + '</div>' : '')
                + '<div class="lesson-time">' + esc(l.start_time.slice(11,16)) + ' ~ ' + esc(l.end_time.slice(11,16)) + '</div>'
                + '<div class="lesson-info">' + esc(l.student_name) + '　<span class="course">' + esc(l.course_name) + '</span></div>'
                + rsBtn
                + '</div>';
        });
    }
    // 教室沒開放自主排課時，這頁就只是課表，不顯示排課按鈕
    if (data.canSchedule) html += '<button class="fab" onclick="openForm()">＋ 排課</button>';
    document.getElementById('app').innerHTML = html;
}

window.shiftWeek = function(d) { WEEK += d; loadWeek(); };
window.gotoWeek = function(w) { WEEK = w; loadWeek(); };

// ---------- 排課表單 ----------
window.openForm = async function() {
    VIEW = 'form';
    document.getElementById('app').innerHTML = '<p class="loading">載入學生清單...</p>';
    try {
        const res = await fetch(API, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: TOKEN, action: 'students' })
        });
        const data = await res.json();
        if (!data.success) { showError('載入失敗', data.message || ''); return; }
        STUDENTS = data.students || [];
        renderForm();
    } catch (e) { showError('載入失敗', '網路連線異常，請稍後再試。'); }
};

function renderForm() {
    let html = '<h2>＋ 排課</h2>';
    if (STUDENTS.length === 0) {
        html += '<p class="sub">目前沒有可排課的學生。請先在「綁定」頁掃描學生的報到 QR 碼，經教室確認後才能排課。</p>'
            + '<button class="btn btn-grey" onclick="backToWeek()">返回課表</button>';
        document.getElementById('app').innerHTML = html;
        return;
    }
    html += '<p class="sub">課程內容與時長會沿用這位學生上一堂課的設定</p>';
    html += '<label class="f">學生</label><select id="fStudent" onchange="onStudentChange()">'
        + '<option value="">請選擇</option>'
        + STUDENTS.map(function(s, i) {
            return '<option value="' + i + '">' + esc(s.student_name) + (s.school_name ? '（' + esc(s.school_name) + '）' : '') + '</option>';
        }).join('') + '</select>';
    html += '<div id="fRest"></div>';
    html += '<div style="margin-top:18px; display:flex; gap:8px;">'
        + '<button class="btn btn-grey" onclick="backToWeek()">返回</button>'
        + '<button class="btn btn-primary" id="fSubmit" style="flex:1;" onclick="submitForm()" disabled>送出</button>'
        + '</div>';
    document.getElementById('app').innerHTML = html;
}

window.backToWeek = function() { VIEW = 'week'; RS_PICKED = null; RS_PENDING = null; loadWeek(); };

// ---------- 調課 ----------
window.openReschedule = function(lessonJson) {
    RS_PICKED = JSON.parse(lessonJson);
    RS_PENDING = null;
    RS_WEEK_OFF = 0;
    const l = RS_PICKED;
    let h = '<h2>🗓️ 調整上課時間</h2>';
    h += '<div class="card"><div class="lesson-info">' + esc(l.student_name) + '　<span class="course">' + esc(l.course_name) + '</span></div>'
       + '<div class="lesson-time">原時間：' + esc(l.start_time.slice(5,10).replace('-','/')) + ' ' + esc(l.start_time.slice(11,16)) + ' ~ ' + esc(l.end_time.slice(11,16)) + '</div></div>';
    h += '<p class="sub" style="margin:10px 0 0;">在網格空白處點一下，就會選好那天那個時間</p>';
    h += '<div id="rsGrid"></div>';
    h += '<div style="display:flex; gap:8px; align-items:flex-end;">'
       + '<div style="flex:1;"><label class="f">日期</label><input type="date" id="rsDate" value="' + esc(l.start_time.slice(0,10)) + '" onchange="rsOnDateChange()"></div>'
       + '<div style="flex:1;"><label class="f">開始</label><input type="time" id="rsTime" step="300" value="' + esc(l.start_time.slice(11,16)) + '" onchange="drawRsGrid()"></div>'
       + '</div>';
    h += '<div id="rsMsg"></div>';
    h += '<div style="margin-top:18px; display:flex; gap:8px;">'
       + '<button class="btn btn-grey" onclick="backToWeek()">返回</button>'
       + '<button class="btn btn-primary" id="rsSubmit" style="flex:1;" onclick="doReschedule()">確認調整</button>'
       + '</div>';
    document.getElementById('app').innerHTML = h;
    rsLoadWeek();
};

// 以「目前選定日期」所在的那一週為基準，可以往前後翻
function rsWeekMonday() {
    const base = new Date(document.getElementById('rsDate').value + 'T00:00:00');
    const dow = base.getDay();
    base.setDate(base.getDate() - (dow === 0 ? 6 : dow - 1) + RS_WEEK_OFF * 7);
    return base;
}
function ymd(d) {
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

window.rsShiftWeek = function(d) { RS_WEEK_OFF += d; rsLoadWeek(); };
window.rsOnDateChange = function() { RS_WEEK_OFF = 0; rsLoadWeek(); };

window.rsLoadWeek = async function() {
    const mon = rsWeekMonday();
    const sun = new Date(mon); sun.setDate(sun.getDate() + 6);
    try {
        const res = await fetch(API, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                token: TOKEN, action: 'busyweek',
                customer: RS_PICKED.customer_id,
                classroom: RS_PICKED.classroom_id || '',
                from: ymd(mon), to: ymd(sun),
                exclude: RS_PICKED.id      // 正在調的這一堂不算佔用
            })
        });
        const data = await res.json();
        window._rsDays = data.days || {};
    } catch (e) { window._rsDays = {}; }
    drawRsGrid();
};

// 整週網格：一次看到七天的佔用，找空檔不用一天一天切
window.drawRsGrid = function() {
    const box = document.getElementById('rsGrid');
    if (!box || !RS_PICKED) return;
    const F = 7, T = 22, PX = 28;
    const H = (T - F) * PX;
    const days = window._rsDays || {};
    const mon = rsWeekMonday();
    const todayStr = ymd(new Date());
    const selDate = document.getElementById('rsDate').value;
    const selFrom = hm2m(document.getElementById('rsTime').value || '00:00');
    const dur = hm2m(RS_PICKED.end_time.slice(11,16)) - hm2m(RS_PICKED.start_time.slice(11,16));
    const selTo = selFrom + dur;
    const px = m => (m - F * 60) / 60 * PX;

    let clash = false;
    let head = '', cols = '', hours = '';
    for (let h = F; h <= T; h++) hours += '<div class="wg-hour" style="top:' + ((h-F)*PX) + 'px;">' + h + '</div>';

    for (let i = 0; i < 7; i++) {
        const d = new Date(mon); d.setDate(d.getDate() + i);
        const ds = ymd(d);
        head += '<div class="' + (ds === todayStr ? 'today' : '') + '">' + DAYS[d.getDay()] + '<br>' + (d.getMonth()+1) + '/' + d.getDate() + '</div>';

        const info = days[ds] || { mine: [], room: [] };
        let blocks = (info.room || []).map(b =>
            '<div class="wg-b wg-room" style="top:' + px(hm2m(b.from)) + 'px; height:' + Math.max(8, px(hm2m(b.to)) - px(hm2m(b.from))) + 'px;"></div>').join('');
        blocks += (info.mine || []).map(b =>
            '<div class="wg-b wg-mine" style="top:' + px(hm2m(b.from)) + 'px; height:' + Math.max(8, px(hm2m(b.to)) - px(hm2m(b.from))) + 'px;"></div>').join('');

        if (ds === selDate) {
            let c = false;
            (info.mine || []).concat(info.room || []).forEach(b => { if (overlaps(selFrom, selTo, hm2m(b.from), hm2m(b.to))) c = true; });
            clash = c;
            blocks += '<div class="wg-b wg-sel' + (c ? ' clash' : '') + '" style="top:' + px(selFrom) + 'px; height:' + Math.max(10, px(selTo) - px(selFrom)) + 'px;"></div>';
        }
        const past = ds < todayStr;
        cols += '<div class="wg-col' + (past ? ' past' : '') + '" data-date="' + ds + '">' + blocks + '</div>';
    }

    box.innerHTML = '<div class="wg-wrap">'
        + '<div class="wg-nav"><button class="btn btn-nav" onclick="rsShiftWeek(-1)">‹</button>'
        + '<span>' + (mon.getMonth()+1) + '/' + mon.getDate() + ' 這週</span>'
        + '<button class="btn btn-nav" onclick="rsShiftWeek(1)">›</button></div>'
        + '<div class="wg-head">' + head + '</div>'
        + '<div class="wg" style="height:' + H + 'px;">' + hours + '<div class="wg-cols">' + cols + '</div></div>'
        + '<div class="wg-legend"><i class="wg-mine"></i>我的課　<i class="wg-room"></i>這間教室被別人用　<i class="wg-sel"></i>要改到的時段</div>'
        + (clash ? '<div class="tl-clash-msg">⚠️ 這個時段和已排定的課重疊，請改選其他時間</div>' : '')
        + '</div>';

    box.querySelectorAll('.wg-col').forEach(function(col) {
        if (col.classList.contains('past')) return;
        col.onclick = function(ev) {
            const y = ev.clientY - col.getBoundingClientRect().top;
            let m = F * 60 + Math.round((y / PX) * 60 / 15) * 15;      // 對齊 15 分鐘
            m = Math.max(F * 60, Math.min(T * 60 - dur, m));
            document.getElementById('rsDate').value = col.dataset.date;
            document.getElementById('rsTime').value = m2hm(m);
            drawRsGrid();
        };
    });
};

window.doReschedule = async function(classroomId) {
    const btn = document.getElementById('rsSubmit');
    const msg = document.getElementById('rsMsg');
    let startStr, endStr;

    if (RS_PENDING) {
        // 教室衝突後改選教室重送，時間沿用第一次的選擇，不用重挑
        startStr = RS_PENDING.start; endStr = RS_PENDING.end;
    } else {
        const d = document.getElementById('rsDate').value;
        const t = document.getElementById('rsTime').value;
        if (!d || !t) { if (msg) msg.innerHTML = '<div class="msg error">請選擇新的日期與時間</div>'; return; }
        // 時長沿用原本這堂課的長度
        const mins = (parseInt(RS_PICKED.end_time.slice(11,13)) * 60 + parseInt(RS_PICKED.end_time.slice(14,16)))
                   - (parseInt(RS_PICKED.start_time.slice(11,13)) * 60 + parseInt(RS_PICKED.start_time.slice(14,16)));
        const total = parseInt(t.slice(0,2)) * 60 + parseInt(t.slice(3,5)) + mins;
        if (total >= 24 * 60) { if (msg) msg.innerHTML = '<div class="msg error">課程時間不能跨到隔天</div>'; return; }
        // 後端要的是不帶時區的本地時間字串，一律字串組合，不經過 Date 物件
        startStr = d + 'T' + t + ':00';
        endStr = d + 'T' + String(Math.floor(total/60)).padStart(2,'0') + ':' + String(total%60).padStart(2,'0') + ':00';
        RS_PENDING = { start: startStr, end: endStr };
    }

    if (btn) { btn.disabled = true; btn.innerText = '處理中...'; }
    try {
        const payload = { token: TOKEN, lessonId: RS_PICKED.id, newStartTime: startStr, newEndTime: endStr };
        if (classroomId) payload.classroomId = classroomId;
        const res = await fetch(RESCHEDULE_API, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (!data.success) {
            if (data.needsClassroomChoice) { rsClassroomChoice(data.message, data.alternativeClassrooms || []); return; }
            if (msg) msg.innerHTML = '<div class="msg error">' + esc(data.message || '調整失敗，請稍後再試。') + '</div>';
            if (btn) { btn.disabled = false; btn.innerText = '確認調整'; }
            RS_PENDING = null;
            return;
        }
        PENDING_MSG = 'ok:✅ 調課成功！';
        RS_LOADED = false;   // 課程時間變了，可調清單要重抓
        VIEW = 'week'; RS_PICKED = null; RS_PENDING = null;
        loadWeek();
    } catch (e) {
        if (msg) msg.innerHTML = '<div class="msg error">網路連線異常，請稍後再試。</div>';
        if (btn) { btn.disabled = false; btn.innerText = '確認調整'; }
    }
};

function rsClassroomChoice(message, alternatives) {
    let h = '<h2>🗓️ 調整上課時間</h2><div class="msg error">' + esc(message) + '</div>';
    if (alternatives.length === 0) {
        h += '<p class="sub">請返回重新選擇別的時間。</p>';
    } else {
        h += '<p class="sub">選擇要換到哪間教室：</p>';
        alternatives.forEach(function(room) {
            h += '<button class="btn btn-primary" style="display:block; width:100%; margin-bottom:8px;" onclick="doReschedule(' + room.id + ')">' + esc(room.name) + '</button>';
        });
    }
    h += '<div id="rsMsg"></div>';
    h += '<button class="btn btn-grey" style="margin-top:10px;" onclick="backToWeek()">返回課表</button>';
    document.getElementById('app').innerHTML = h;
}

window.onStudentChange = async function() {
    const idx = document.getElementById('fStudent').value;
    const rest = document.getElementById('fRest');
    document.getElementById('fSubmit').disabled = true;
    if (idx === '') { rest.innerHTML = ''; return; }
    const s = STUDENTS[idx];

    // 沒有上課紀錄代表這是第一堂，牽涉報名方案與收費，交給教室處理
    if (!s.template) {
        rest.innerHTML = '<div class="msg error" style="margin-top:12px;">這位學生還沒有您的上課紀錄，第一堂課請聯繫教室安排。</div>';
        return;
    }

    rest.innerHTML = '<p class="loading">載入教室...</p>';
    try {
        const res = await fetch(API, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: TOKEN, action: 'rooms', customer: s.customer_id })
        });
        const data = await res.json();
        ROOMS = data.rooms || [];
    } catch (e) { ROOMS = []; }

    const branches = [...new Set(ROOMS.map(r => r.branch).filter(Boolean))];
    const today = new Date();
    const iso = new Date(today.getTime() - today.getTimezoneOffset() * 60000).toISOString().slice(0, 10);

    let h = '<div class="msg ok" style="margin-top:12px;">課程：' + esc(s.template.course_name || '（未命名）')
        + '　·　' + s.template.duration_min + ' 分鐘</div>';
    h += '<label class="f">日期</label><input type="date" id="fDate" min="' + iso + '" value="' + iso + '" onchange="refreshBusy()">';
    if (branches.length > 1) {
        h += '<label class="f">校區</label><select id="fBranch" onchange="onBranchChange()">'
            + '<option value="">請選擇</option>'
            + branches.map(b => '<option value="' + esc(b) + '">' + esc(b) + '</option>').join('') + '</select>';
    }
    h += '<label class="f">教室</label><select id="fRoom" onchange="refreshBusy()"><option value="">請選擇</option></select>';
    h += '<label class="f">開始時間</label><input type="time" id="fTime" step="300" value="16:00" onchange="drawFormTimeline()">';
    h += '<label class="f">時長（分鐘）</label><select id="fDur" onchange="drawFormTimeline()">'
        + [30, 45, 60, 75, 90, 120].map(m => '<option value="' + m + '"' + (m === s.template.duration_min ? ' selected' : '') + '>' + m + ' 分鐘</option>').join('')
        + '</select>';
    h += '<div id="fBusy"></div>';
    rest.innerHTML = h;

    fillRooms(branches.length > 1 ? '' : (branches[0] || ''));
    refreshBusy();
};

function fillRooms(branch) {
    const sel = document.getElementById('fRoom');
    if (!sel) return;
    const list = branch ? ROOMS.filter(r => r.branch === branch) : ROOMS;
    sel.innerHTML = '<option value="">請選擇</option>'
        + list.map(r => '<option value="' + r.id + '">' + esc(r.name) + '</option>').join('');
}

window.onBranchChange = function() {
    fillRooms(document.getElementById('fBranch').value);
    refreshBusy();
};

window.refreshBusy = async function() {
    validate();
    const idx = document.getElementById('fStudent').value;
    const dateEl = document.getElementById('fDate');
    const roomEl = document.getElementById('fRoom');
    const box = document.getElementById('fBusy');
    if (idx === '' || !dateEl || !box) return;
    box.innerHTML = '';
    try {
        const res = await fetch(API, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                token: TOKEN, action: 'busy',
                customer: STUDENTS[idx].customer_id,
                classroom: roomEl ? roomEl.value : '',
                date: dateEl.value
            })
        });
        const data = await res.json();
        window._busy = data.busy || { mine: [], room: [] };
        drawFormTimeline();
    } catch (e) {}
};

// 時間或時長一改就重畫，讓「選的時段」跟著移動——
// 否則會出現「畫面顯示衝突但其實可以送出」這種比沒提示更糟的狀況
window.drawFormTimeline = function() {
    const t = document.getElementById('fTime');
    const dur = document.getElementById('fDur');
    if (!t || !window._busy) return;
    const from = hm2m(t.value || '00:00');
    const to = from + (parseInt(dur ? dur.value : 60) || 60);
    renderTimeline('fBusy', window._busy, from, to, 'fTime');
    validate();
};

// ---------- 當天時間軸 ----------
// 用畫的比用寫的清楚：已佔用的區塊和你選的時段疊在同一張圖上，
// 有沒有撞到一眼就知道，不用讀一串文字自己比對
const TL_FROM = 7, TL_TO = 22, TL_PX = 30;   // 7:00~22:00，每小時 30px
function m2px(min) { return (min - TL_FROM * 60) / 60 * TL_PX; }
function hm2m(hm) { return parseInt(hm.slice(0,2)) * 60 + parseInt(hm.slice(3,5)); }
function m2hm(m) { return String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0'); }
function overlaps(aF, aT, bF, bT) { return aF < bT && aT > bF; }

// 回傳是否有衝突，順便把圖畫出來
function renderTimeline(boxId, busy, selFrom, selTo, onPickId) {
    const box = document.getElementById(boxId);
    if (!box) return false;
    const H = (TL_TO - TL_FROM) * TL_PX;
    const hasRoom = busy.room && busy.room.length >= 0;

    let clash = false;
    if (selFrom != null) {
        (busy.mine || []).forEach(b => { if (overlaps(selFrom, selTo, hm2m(b.from), hm2m(b.to))) clash = true; });
        (busy.room || []).forEach(b => { if (overlaps(selFrom, selTo, hm2m(b.from), hm2m(b.to))) clash = true; });
    }

    let hours = '';
    for (let h = TL_FROM; h <= TL_TO; h++) {
        hours += '<div class="tl-hour" style="top:' + ((h - TL_FROM) * TL_PX) + 'px;">' + h + ':00</div>';
    }
    const blocks = (arr, cls, label) => (arr || []).map(b => {
        const f = hm2m(b.from), t = hm2m(b.to);
        return '<div class="tl-block ' + cls + '" style="top:' + m2px(f) + 'px; height:' + Math.max(12, m2px(t) - m2px(f)) + 'px;">'
            + esc(b.from) + (label && b.room ? ' ' + esc(b.room) : '') + '</div>';
    }).join('');

    const sel = selFrom != null
        ? '<div class="tl-block tl-sel' + (clash ? ' clash' : '') + '" style="top:' + m2px(selFrom) + 'px; height:' + Math.max(14, m2px(selTo) - m2px(selFrom)) + 'px;">'
          + m2hm(selFrom) + '</div>'
        : '';

    box.innerHTML = '<div class="tl-wrap">'
        + '<div class="tl-head"><div>我的課</div><div>' + (hasRoom ? '這間教室' : '教室') + '</div></div>'
        + '<div class="tl" style="height:' + H + 'px;">' + hours
        + '<div class="tl-lanes">'
        + '<div class="tl-lane" data-lane="mine">' + blocks(busy.mine, 'tl-mine', true) + sel + '</div>'
        + '<div class="tl-lane" data-lane="room">' + blocks(busy.room, 'tl-room', false) + '</div>'
        + '</div></div>'
        + '<div class="tl-tip">點時間軸可以直接選時間</div>'
        + (clash ? '<div class="tl-clash-msg">⚠️ 這個時段和已排定的課重疊，請改選其他時間</div>' : '')
        + '</div>';

    if (onPickId) {
        box.querySelectorAll('.tl-lane').forEach(function(lane) {
            lane.onclick = function(ev) {
                const y = ev.clientY - lane.getBoundingClientRect().top;
                let mins = TL_FROM * 60 + Math.round((y / TL_PX) * 60 / 15) * 15;   // 對齊到 15 分鐘
                mins = Math.max(TL_FROM * 60, Math.min(TL_TO * 60 - 15, mins));
                const inp = document.getElementById(onPickId);
                if (inp) { inp.value = m2hm(mins); inp.dispatchEvent(new Event('change')); }
            };
        });
    }
    return clash;
}

function validate() {
    const btn = document.getElementById('fSubmit');
    if (!btn) return;
    const idx = document.getElementById('fStudent').value;
    const d = document.getElementById('fDate');
    const t = document.getElementById('fTime');
    const r = document.getElementById('fRoom');
    btn.disabled = !(idx !== '' && d && d.value && t && t.value && r && r.value);
}

window.submitForm = async function() {
    const btn = document.getElementById('fSubmit');
    btn.disabled = true;
    btn.innerText = '送出中...';
    const idx = document.getElementById('fStudent').value;
    try {
        const res = await fetch(API, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                token: TOKEN, action: 'submit',
                customer: STUDENTS[idx].customer_id,
                student: STUDENTS[idx].student_id,
                classroom: document.getElementById('fRoom').value,
                date: document.getElementById('fDate').value,
                time: document.getElementById('fTime').value,
                duration: document.getElementById('fDur').value
            })
        });
        const data = await res.json();
        if (!data.success) { showError('操作失敗', data.message || ''); return; }
        PENDING_MSG = data.actionResult || '';
        if (PENDING_MSG.indexOf('ok:') === 0) {
            VIEW = 'week'; WEEK = 0; loadWeek();     // 成功就回課表，順便讓老師看到新排的課
        } else {
            renderForm();
            document.getElementById('app').insertAdjacentHTML('afterbegin', msgHtml());
        }
    } catch (e) {
        showError('送出失敗', '網路連線異常，請稍後再試。');
    }
};

async function boot() {
    try { await liff.init({ liffId: LIFF_ID }); }
    catch (e) { console.error('LIFF 初始化失敗', e); }   // 這頁不需要掃碼，初始化失敗仍可正常使用
    TOKEN = getTokenFromUrl();
    if (!TOKEN) { showError('連結錯誤', '缺少存取憑證，請回到 LINE 重新開啟。'); return; }
    loadWeek();
}
boot();
